<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{% block title %}CryptoSystem{% endblock %}</title>
  <link rel="icon" href="{{ url_for('favicon') }}?v={{ asset_v }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}?v={{ asset_v }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}?v={{ asset_v }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v={{ asset_v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    (function () {
      var k = 'crypto-theme';
      var s = localStorage.getItem(k);
      var t = (s === 'light' || s === 'dark') ? s
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-bg" aria-hidden="true">
    <div class="app-bg__mesh"></div>
    <div class="app-bg__grid"></div>
  </div>

  <header class="navbar">
    <a href="{{ url_for('index') }}" class="navbar-brand">
      <span class="brand-icon">
        <img
          src="{{ url_for('static', filename='logo.png') }}?v={{ asset_v }}"
          alt="CryptoSystem"
          class="brand-logo"
          width="38"
          height="38"
          decoding="async"
          onerror="this.hidden=true;this.nextElementSibling.hidden=false"
        >
        <svg class="brand-logo-fallback" hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <span class="brand-text">CryptoSystem</span>
    </a>

    <nav class="navbar-links" id="main-nav" aria-label="Main navigation">
      <a href="{{ url_for('index') }}" class="nav-link {% if active_page == 'encrypt' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Encrypt</span>
      </a>
      <a href="{{ url_for('decrypt_page') }}" class="nav-link {% if active_page == 'decrypt' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        <span>Decrypt</span>
      </a>
      <a href="{{ url_for('performance_page') }}" class="nav-link {% if active_page == 'performance' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-8"/></svg>
        <span>Performance</span>
      </a>
      <a href="{{ url_for('about_page') }}" class="nav-link {% if active_page == 'about' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>About</span>
      </a>
    </nav>

    <div class="navbar-actions">
      <div class="theme-switch" role="group" aria-label="Appearance">
        <button type="button" class="theme-switch-btn" data-set-theme="light" aria-pressed="true" title="Light mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span class="theme-switch-label">Light</span>
        </button>
        <button type="button" class="theme-switch-btn" data-set-theme="dark" aria-pressed="false" title="Dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span class="theme-switch-label">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>CryptoSystem &mdash; Fundamentals of Cryptography</p>
    <p class="footer-meta">Galois LFSR &middot; Custom Feistel cipher</p>
  </footer>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="{{ url_for('index') }}" class="bottom-nav-item {% if active_page == 'encrypt' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Encrypt</span>
    </a>
    <a href="{{ url_for('decrypt_page') }}" class="bottom-nav-item {% if active_page == 'decrypt' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      <span>Decrypt</span>
    </a>
    <a href="{{ url_for('performance_page') }}" class="bottom-nav-item {% if active_page == 'performance' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-8"/></svg>
      <span>Stats</span>
    </a>
    <a href="{{ url_for('about_page') }}" class="bottom-nav-item {% if active_page == 'about' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>About</span>
    </a>
  </nav>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <script>
    (function () {
      fetch('{{ url_for("health") }}', { cache: 'no-store' }).catch(function () {});
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
